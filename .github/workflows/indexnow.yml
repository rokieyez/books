# 서재가 배포되면 검색엔진에 알린다 (IndexNow — 빙·Yandex·Seznam)
#
# 열쇠 파일과 알림 도구는 도메인을 가진 루트 저장소(rokieyez.github.io)에
# 있다 — IndexNow 의 열쇠는 도메인 하나에 하나이기 때문이다. 여기서는
# 그 열쇠를 그대로 쓰고 서재의 지도만 알린다.
#
# 구글과 네이버는 이 규약을 쓰지 않는다 (사람이 직접 제출해야 한다).
name: 바뀐 곳을 알린다

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  # job 의 열쇠(id)는 영문·숫자·-·_ 만 받는다 — 보이는 이름만 우리말로
  indexnow:
    name: 알린다
    runs-on: ubuntu-latest
    steps:
      - name: 배포가 끝나기를 기다린다
        run: sleep 120
      - name: 서재의 지도를 알린다
        run: |
          KEY=9ea4480d4cbad8983eaf5ad7e326b82c
          URLS=$(curl -sf https://www.rokiz.net/books/sitemap.xml \
            | grep -o '<loc>[^<]*</loc>' | sed 's|</\?loc>||g' \
            | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "$URLS" | head -c 200; echo
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"www.rokiz.net\",\"key\":\"$KEY\",\"keyLocation\":\"https://www.rokiz.net/$KEY.txt\",\"urlList\":$URLS}" \
            -w '\n%{http_code}\n'
