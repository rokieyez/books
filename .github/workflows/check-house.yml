# 배포가 끝나면 집이 한 채로 서 있는지 견준다
#
# 왜 서재에서도 도는가: 점검 도구는 루트 사이트 저장소에 있고 그쪽 push 에
# 맞춰 돈다. 그런데 서재는 따로 배포되므로, 여기서 나눔 쪽 549장을 다시
# 짓거나 canonical 규칙을 손봐도 그쪽은 알지 못한다 — 이레에 한 번 도는
# 정기 점검을 기다려야 했다. 도구를 받아 와 여기서도 돌린다.
#
# 도구를 베껴 두지 않고 받아 오는 까닭: 규칙이 두 벌이 되면 반드시 어긋난다.
# 순수 node 스크립트라 받아서 그대로 돌리면 된다 (설치할 것이 없다).
name: 집이 한 채인가

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: check-house
  cancel-in-progress: true

jobs:
  # job 의 열쇠(id)는 영문·숫자·-·_ 만 받는다 — 보이는 이름만 우리말로
  check-house:
    name: 견준다
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 왜 자지 않고 묻나: 「120초 자기」는 배포가 2분을 넘기면 옛 사이트를
      # 견주고 초록불을 켰다. Pages 의 마지막 빌드가 이 커밋으로 끝났는지를
      # 15초마다 묻고, 10분 안에 안 끝나면 빨간불. 묻는 것 자체가 막히면
      # (권한·API 사정) 예전처럼 2분 자고 넘어간다 — 못 묻는다고 안 견줄 수는 없다.
      - name: 배포가 끝나기를 기다린다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            if ! json=$(gh api "repos/${{ github.repository }}/pages/builds/latest" 2>/dev/null); then
              echo "빌드 상태를 묻지 못했습니다 — 2분 자고 넘어갑니다"; sleep 120; exit 0
            fi
            st=$(jq -r .status <<<"$json"); sha=$(jq -r .commit <<<"$json")
            echo "$i: $st ${sha:0:7} (기다리는 것: ${GITHUB_SHA:0:7})"
            if [ "$st" = built ] && [ "$sha" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 15
          done
          echo "10분이 지나도 이 커밋이 배포되지 않았습니다"; exit 1
      - name: 점검 도구를 받아 온다
        run: |
          curl -sSfL -o check-house.mjs \
            https://raw.githubusercontent.com/rokieyez/rokieyez.github.io/main/tools/check-house.mjs
      - name: 방마다의 규칙을 견준다
        run: node check-house.mjs
