<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>없는 문 — 서가 뒤의 방</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/books/favicon.svg" type="image/svg+xml">
<style>
  html { color-scheme: dark }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px;
    background: #171009; color: #A3947A;
    font: 14px/1.9 "Gowun Batang", serif; text-align: center;
  }
  h1 { margin: 0; font-size: 20px; color: #E2D5B8; font-weight: 400; }
  p { margin: 0; max-width: 34ch; }
  a {
    color: #E0B15E; text-decoration: none; border-bottom: 1px solid rgba(224,177,94,.4);
    padding-bottom: 2px;
  }
  code { font-family: ui-monospace, monospace; font-size: 11px; opacity: .6; }
  ul#near { margin: 18px 0 0; padding: 0; list-style: none; text-align: left;
            display: inline-block; }
  ul#near li { margin: 0 0 7px; font-size: 14px }
  ul#near i { font-style: normal; opacity: .55; font-size: 12.5px }
</style>
</head>
<body>
  <h1>이 문 뒤에는 아무것도 없습니다</h1>
  <p id="say">주소를 다시 보시거나, 서재로 돌아가세요.</p>
  <p><a href="/books/">서가 뒤의 방으로</a></p>
  <!-- 아이디가 없는 주소면 제목으로 찾아 권한다 -->
  <ul id="near" hidden></ul>
  <code id="where"></code>
<script src="/books/js/config.js"></script>
<script>
  /* 나눔 쪽(b/…)은 손으로 다시 지을 때만 생긴다. 새로 꽂은 책의 링크를
     아직 안 지었더라도 사람은 그 책에 닿아야 한다 — 주소에서 책 아이디를
     주워 서재의 서표로 보낸다. (미리보기만 없다)

     두 꼴을 다 알아본다:
       b/<아이디 서른여섯 자>.html      옛 주소
       b/<제목>-<아이디 앞 여덟 자>.html  지금 주소
     서재는 앞자리만 와도 그것으로 시작하는 책을 찾아 연다. */
  var p = location.pathname;
  var m = p.match(/\/b\/([0-9a-f]{8}-[0-9a-f-]{27})\.html$/i)
       || p.match(/-([0-9a-f]{8})\.html$/i);
  document.getElementById("where").textContent = decodeURIComponent(p);
  if (m) {
    document.getElementById("say").textContent = "그 책의 서표로 가는 중…";
    location.replace("/books/#book/" + m[1]);
  } else if (/\/b\//.test(p)) {
    /* 아이디가 없는 나눔 쪽 주소 — 오래된 링크이거나 손으로 친 주소다.
       「아무것도 없습니다」로 끝내지 말고 제목으로 서가를 뒤져 권한다.
       루트의 잠긴 문이 글방에 대해 하는 것과 같은 몸짓이다. */
    찾아본다(p.split("/").pop().replace(/\.html$/i, ""));
  }

  function 찾아본다(이름) {
    var 말 = decodeURIComponent(이름).replace(/-+/g, " ").trim();
    if (말.length < 2) return;
    var cfg = window.POST_LIBROS_CONFIG;
    if (!cfg) return;
    document.getElementById("say").textContent =
      "그런 쪽은 없습니다. 서가에서 비슷한 제목을 찾아봅니다…";
    /* 첫 두 낱말로만 묻는다 — 슬러그가 길수록 통째로는 아무것도 안 걸린다 */
    var 씨 = 말.split(" ").slice(0, 2).join(" ");
    fetch(cfg.supabaseUrl + "/rest/v1/books?select=id,title,author" +
          "&title=ilike.*" + encodeURIComponent(씨) + "*&order=title.asc&limit=6",
          { headers: { apikey: cfg.supabaseKey, Authorization: "Bearer " + cfg.supabaseKey } })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (책들) {
        if (!책들.length) {
          document.getElementById("say").textContent =
            "그런 쪽은 없고, 서가에도 비슷한 제목이 없습니다.";
          return;
        }
        document.getElementById("say").textContent = "그런 쪽은 없습니다. 이 책들일까요?";
        var ul = document.getElementById("near");
        책들.forEach(function (b) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = "/books/#book/" + b.id;
          a.textContent = b.title;
          var i = document.createElement("i");
          i.textContent = " " + (b.author || "지은이 미상");
          li.appendChild(a); li.appendChild(i); ul.appendChild(li);
        });
        ul.hidden = false;
      })
      .catch(function () { /* 서재가 자고 있으면 조용히 */ });
  }
</script>
</body>
</html>
